<style>
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0);}100%{opacity:0;transform:translate(-50%,-30px);}}
.flash{position:absolute;left:50%;top:38%;transform:translate(-50%,0);font-weight:500;color:var(--text-primary);pointer-events:none;animation:floatUp 1.2s ease forwards;background:var(--surface-2);padding:6px 12px;border-radius:var(--radius);white-space:nowrap;}
.overflow-warn{border:3px solid var(--border-danger);border-radius:var(--radius);}
</style>
<h2 class="sr-only">うんこ弾幕をよけながらパワーアップし、ボスの巨大うんこと戦うシューティングゲーム</h2>
<div style="max-width:360px;margin:0 auto 10px;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
    <span style="font-size:12px;color:var(--text-secondary);">HP</span>
    <span id="stage-label" style="font-size:12px;color:var(--text-secondary);">ステージ 1</span>
  </div>
  <div style="background:var(--surface-1);border-radius:var(--radius);height:10px;overflow:hidden;">
    <div id="hp-bar" style="background:var(--fill-success);height:100%;width:100%;"></div>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
    <span id="power-label" style="font-size:12px;color:var(--text-secondary);">ちから 0</span>
    <span id="timer-label" style="font-size:12px;color:var(--text-secondary);">ボスまで 90s</span>
  </div>
  <div id="boss-bar-wrap" style="display:none;background:var(--surface-1);border-radius:var(--radius);height:8px;overflow:hidden;margin-top:4px;">
    <div id="boss-bar" style="background:var(--fill-danger);height:100%;width:100%;"></div>
  </div>
</div>
<div style="position:relative;width:100%;max-width:360px;margin:0 auto;box-sizing:border-box;">
  <canvas id="game" width="340" height="520" style="width:100%;height:auto;display:block;border-radius:var(--radius);background:var(--surface-1);touch-action:none;"></canvas>
  <div id="overlay" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface-1);border-radius:var(--radius);gap:10px;padding:16px;text-align:center;">
    <div style="font-size:16px;font-weight:500;">うんこ弾幕シューティング</div>
    <div style="font-size:12px;color:var(--text-secondary);line-height:1.6;">カレー：うんこで強化（画面にたまる）<br>べんき：うんこを吸って消せる<br>たまりすぎるとダメージ！<br>90秒でボス「巨大うんこ」が出現</div>
    <button id="start-btn">はじめる</button>
  </div>
</div>
<div style="display:flex;justify-content:center;margin-top:10px;">
  <button id="mode-btn" style="min-width:220px;">カレーモード（タップで切替）</button>
</div>
<div style="text-align:center;margin-top:8px;font-size:12px;color:var(--text-secondary);">← → キーかドラッグで移動 / Spaceでモード切替</div>
<script>
(function(){
  const canvas=document.getElementById('game');
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  const hpBar=document.getElementById('hp-bar');
  const stageLabel=document.getElementById('stage-label');
  const powerLabel=document.getElementById('power-label');
  const timerLabel=document.getElementById('timer-label');
  const bossBarWrap=document.getElementById('boss-bar-wrap');
  const bossBar=document.getElementById('boss-bar');
  const overlay=document.getElementById('overlay');
  const startBtn=document.getElementById('start-btn');
  const modeBtn=document.getElementById('mode-btn');
  const wrapper=canvas.parentElement;

  const PHASE_DURATION=90000;
  const OVERFLOW_THRESHOLD=20;

  let player, poops, shots, stage, timer, spawnTimer, shotTimer, bossActive, boss, running, transitioning, moveLeft, moveRight, lastTs;

  function initGame(){
    stage=1;
    player={x:W/2-28,w:56,h:38,mode:'curry',hp:100,hpMax:100,power:0};
    startStage();
  }

  function startStage(){
    poops=[]; shots=[]; timer=0; spawnTimer=0; shotTimer=0;
    bossActive=false; boss=null; transitioning=false;
    bossBarWrap.style.display='none';
    updateHUD();
  }

  function updateHUD(){
    hpBar.style.width=Math.max(0,player.hp/player.hpMax*100)+'%';
    stageLabel.textContent='ステージ '+stage;
    powerLabel.textContent='ちから '+Math.round(player.power);
    if(bossActive && boss){
      timerLabel.textContent='ボスせん';
      bossBarWrap.style.display='block';
      bossBar.style.width=Math.max(0,boss.hp/boss.hpMax*100)+'%';
    } else {
      const remain=Math.max(0,Math.ceil((PHASE_DURATION-timer)/1000));
      timerLabel.textContent='ボスまで '+remain+'s';
      bossBarWrap.style.display='none';
    }
  }

  function flashMsg(text){
    const f=document.createElement('div');
    f.className='flash';
    f.textContent=text;
    wrapper.appendChild(f);
    setTimeout(()=>f.remove(),1200);
  }

  function spawnWave(){
    const progress=timer/PHASE_DURATION;
    const speed=1.6+stage*0.12+progress*1.0+Math.random()*0.4;
    const r=12+Math.random()*3;
    const pattern=Math.random();
    if(pattern<0.45){
      poops.push({x:20+Math.random()*(W-40),y:-20,vx:0,vy:speed,r,collected:false});
    } else if(pattern<0.75){
      const gapAt=Math.floor(Math.random()*5);
      const cols=5;
      for(let i=0;i<cols;i++){
        if(i===gapAt) continue;
        poops.push({x:20+i*(W-40)/(cols-1),y:-20,vx:0,vy:speed,r,collected:false});
      }
    } else {
      const count=5;
      for(let i=0;i<count;i++){
        const vx=(i-(count-1)/2)*0.6;
        poops.push({x:W/2,y:-20,vx,vy:speed,r,collected:false});
      }
    }
  }

  function spawnBossBurst(){
    const n=8+Math.min(stage,6);
    for(let i=0;i<n;i++){
      const angle=(Math.PI*2/n)*i;
      poops.push({x:boss.x,y:boss.y,vx:Math.cos(angle)*1.8,vy:1.2+Math.sin(angle)*0.6+1.4,r:12,collected:false});
    }
  }

  function startBoss(){
    bossActive=true;
    poops=[];
    const hp=60+(stage-1)*35;
    boss={x:W/2,y:80,hp,hpMax:hp,dir:1,burstTimer:0,burstInterval:Math.max(900,1700-stage*60)};
    flashMsg('巨大うんこ しゅつげん！');
  }

  function defeatBoss(){
    transitioning=true;
    flashMsg('ステージ'+stage+' クリア！');
    setTimeout(()=>{
      stage+=1;
      player.hp=Math.min(player.hpMax,player.hp+25);
      startStage();
    },1400);
  }

  function endGame(){
    running=false;
    overlay.innerHTML='';
    overlay.style.display='flex';
    const t1=document.createElement('div');
    t1.style.cssText='font-size:16px;font-weight:500;';
    t1.textContent='ゲームオーバー';
    const t2=document.createElement('div');
    t2.style.cssText='font-size:13px;color:var(--text-secondary);';
    t2.textContent='とうたつステージ '+stage+' / ちから '+Math.round(player.power);
    const btn=document.createElement('button');
    btn.textContent='もういちど';
    btn.addEventListener('click',()=>{
      initGame(); refreshModeBtn();
      overlay.style.display='none';
      running=true; lastTs=performance.now();
      requestAnimationFrame(loop);
    });
    overlay.appendChild(t1); overlay.appendChild(t2); overlay.appendChild(btn);
  }

  function drawPlayer(){
    const x=player.x,y=H-70,w=player.w,h=player.h;
    if(player.mode==='curry'){
      ctx.fillStyle='#c97a2b';
      ctx.beginPath(); ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#f2e9d8';
      ctx.beginPath(); ctx.ellipse(x+w/2,y+h/2+6,w/3,h/4,0,0,Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle='#e8e8e4'; ctx.strokeStyle='#a8a8a2'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.ellipse(x+w/2,y+h/2-4,w/2,h/2.4,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#cfcfc8'; ctx.fillRect(x+w/2-w/3,y+h-10,w*2/3,12);
    }
  }

  function drawPoop(p){
    ctx.fillStyle=p.collected?'#d9a62b':'#8b5e3c';
    ctx.strokeStyle=p.collected?'#8f5f10':'#5f3d24';
    ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }

  function drawBoss(){
    if(!boss) return;
    ctx.fillStyle='#6b4423'; ctx.strokeStyle='#432a15'; ctx.lineWidth=2;
    [0.8,1,1.15].forEach((s,i)=>{
      ctx.beginPath();
      ctx.arc(boss.x,boss.y+(2-i)*10,26*s*0.55,0,Math.PI*2);
      ctx.fill(); ctx.stroke();
    });
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(boss.x-10,boss.y-6,5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(boss.x+10,boss.y-6,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#2a1a10';
    ctx.beginPath(); ctx.arc(boss.x-10,boss.y-6,2.4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(boss.x+10,boss.y-6,2.4,0,Math.PI*2); ctx.fill();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    poops.forEach(drawPoop);
    if(bossActive) drawBoss();
    ctx.fillStyle='#e0a83c';
    shots.forEach(s=>{ ctx.fillRect(s.x-2,s.y-6,4,10); });
    drawPlayer();
  }

  function loop(ts){
    if(!running) return;
    const dt=ts-lastTs; lastTs=ts;
    const dtScale=dt/16.67;

    if(!transitioning){
      if(!bossActive){
        timer+=dt; spawnTimer+=dt;
        const progress=Math.min(1,timer/PHASE_DURATION);
        const interval=Math.max(260,850-stage*40-progress*400);
        if(spawnTimer>interval && poops.length<70){ spawnWave(); spawnTimer=0; }
        if(timer>=PHASE_DURATION){ startBoss(); }
      } else {
        boss.x+=boss.dir*0.5*dtScale;
        if(boss.x<50||boss.x>W-50) boss.dir*=-1;
        boss.burstTimer+=dt;
        if(boss.burstTimer>boss.burstInterval && poops.length<70){ spawnBossBurst(); boss.burstTimer=0; }
      }

      shotTimer+=dt;
      const shotInterval=Math.max(180,550-player.power*10);
      if(shotTimer>shotInterval){ shots.push({x:player.x+player.w/2,y:H-80}); shotTimer=0; }

      for(let i=shots.length-1;i>=0;i--){
        const s=shots[i];
        s.y-=6*dtScale;
        if(bossActive&&boss&&Math.abs(s.x-boss.x)<28&&Math.abs(s.y-boss.y)<28){
          boss.hp-=3+player.power*0.4;
          shots.splice(i,1);
          if(boss.hp<=0){ defeatBoss(); }
          continue;
        }
        if(s.y<-10) shots.splice(i,1);
      }

      if(moveLeft) player.x-=4.2*dtScale;
      if(moveRight) player.x+=4.2*dtScale;
      player.x=Math.max(10,Math.min(W-10-player.w,player.x));

      for(let i=poops.length-1;i>=0;i--){
        const p=poops[i];
        p.x+=p.vx*dtScale; p.y+=p.vy*dtScale;
        const py=H-70,ph=player.h;
        const hit=p.x>player.x-p.r && p.x<player.x+player.w+p.r && p.y+p.r>py && p.y-p.r<py+ph;
        if(hit){
          if(player.mode==='toilet'){ poops.splice(i,1); continue; }
          else if(player.mode==='curry' && !p.collected){ p.collected=true; player.power+=1; }
        }
        if(p.y-p.r>H || p.x<-30 || p.x>W+30){ poops.splice(i,1); }
      }

      if(poops.length>OVERFLOW_THRESHOLD){
        player.hp-=0.2*dtScale;
        wrapper.classList.add('overflow-warn');
      } else {
        wrapper.classList.remove('overflow-warn');
      }

      if(player.hp<=0){ player.hp=0; updateHUD(); endGame(); return; }
      updateHUD();
    }

    draw();
    requestAnimationFrame(loop);
  }

  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'){moveLeft=true;e.preventDefault();}
    if(e.key==='ArrowRight'){moveRight=true;e.preventDefault();}
    if(e.code==='Space'){ toggleMode(); e.preventDefault(); }
  });
  document.addEventListener('keyup',e=>{
    if(e.key==='ArrowLeft') moveLeft=false;
    if(e.key==='ArrowRight') moveRight=false;
  });
  canvas.addEventListener('pointermove',e=>{
    const rect=canvas.getBoundingClientRect();
    const scale=W/rect.width;
    const x=(e.clientX-rect.left)*scale;
    player.x=Math.max(10,Math.min(W-10-player.w,x-player.w/2));
  });

  function toggleMode(){
    if(!player) return;
    player.mode = player.mode==='curry' ? 'toilet' : 'curry';
    refreshModeBtn();
  }
  function refreshModeBtn(){
    if(player.mode==='curry'){
      modeBtn.textContent='カレーモード（タップで切替）';
      modeBtn.style.background='var(--bg-warning)';
      modeBtn.style.color='var(--text-warning)';
    } else {
      modeBtn.textContent='べんきモード（タップで切替）';
      modeBtn.style.background='var(--bg-accent)';
      modeBtn.style.color='var(--text-accent)';
    }
  }
  modeBtn.addEventListener('click',toggleMode);

  startBtn.addEventListener('click',()=>{
    initGame(); refreshModeBtn();
    overlay.style.display='none';
    running=true; lastTs=performance.now();
    requestAnimationFrame(loop);
  });

  initGame();
  refreshModeBtn();
  draw();
})();
</script>
